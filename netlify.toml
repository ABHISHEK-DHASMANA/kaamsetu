[build]
  command = "cd client && npm install && npm run build && cd ../server && npm install"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  DEMO_MODE = "true"
  JWT_SECRET = "kaamsetu_super_secure_jwt_secret_key_2026_hackathon"
  NODE_ENV = "production"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
