name: Backend tests

on:
  push:
    branches: [master]
    paths:
      - 'server/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run matching engine tests
        run: npm test
